name: Release Glowbom OSS CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Check public source
        run: |
          if [ -f oss/scripts/audit-publication.py ]; then
            python3 -B oss/scripts/audit-publication.py
          else
            python3 -B scripts/audit-publication.py
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          if [ -d oss/cli ]; then
            CLI_DIR="oss/cli"
          else
            CLI_DIR="cli"
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          SHA="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          cd "${CLI_DIR}"
          go build \
            -ldflags "-s -w -X main.version=${TAG} -X main.commit=${SHA} -X main.date=${DATE}" \
            -o "glowbom-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" \
            .

      - name: Create archives
        run: |
          if [ -d oss/cli ]; then
            CLI_DIR="oss/cli"
          else
            CLI_DIR="cli"
          fi
          cd "${CLI_DIR}"
          BIN="glowbom-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp "${BIN}.exe" glowbom.exe
            zip "${BIN}.zip" glowbom.exe
            cp glowbom.exe glowby.exe
            zip "glowby-${{ matrix.goos }}-${{ matrix.goarch }}.zip" glowby.exe
          else
            cp "${BIN}" glowbom
            tar czf "${BIN}.tar.gz" glowbom
            cp glowbom glowby
            tar czf "glowby-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" glowby
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glowbom-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            oss/cli/glowbom-*.tar.gz
            oss/cli/glowbom-*.zip
            cli/glowbom-*.tar.gz
            cli/glowbom-*.zip
            oss/cli/glowby-*.tar.gz
            oss/cli/glowby-*.zip
            cli/glowby-*.tar.gz
            cli/glowby-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release archives
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path

          expected = {
              f"{name}-{system}-{arch}.{'zip' if system == 'windows' else 'tar.gz'}"
              for name in ("glowbom", "glowby")
              for system in ("darwin", "linux", "windows")
              for arch in ("amd64", "arm64")
          }
          actual = Counter(
              path.name for path in Path("artifacts").rglob("*")
              if path.is_file() and (path.name.endswith(".tar.gz") or path.suffix == ".zip")
          )
          if set(actual) != expected or any(count != 1 for count in actual.values()):
              raise SystemExit("Release archives are missing, duplicated, or unexpected")
          print(f"Verified {len(expected)} release archives")
          PY

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
